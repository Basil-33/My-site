<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12040a">
<title>دعوة زفاف | باسل وسحر</title>
<meta name="description" content="دعوة زفاف باسل محمد البقمي وسحر المالكي">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --wine: #5e1220; --wine-2: #8c1f33; --wine-3: #a8344a;
    --gold: #d9b878; --gold-2: #f3dfae; --gold-3: #a8844a;
    --paper: #fbf5ea; --paper-2: #f1e5cf; --ink: #3d0f19; --muted: #8a6a4a;
    --ease: cubic-bezier(.22, .8, .2, 1);
    --ease-io: cubic-bezier(.65, 0, .25, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Tajawal", sans-serif; color: var(--paper);
    background: #12040a; overflow: hidden;
    -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }

  /* الخلفية */
  .bg { position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(120% 70% at 50% 0%, #5a1426 0%, transparent 60%),
      radial-gradient(90% 60% at 50% 110%, #3a0b16 0%, transparent 60%),
      linear-gradient(#1c060d, #0d0306); }
  .bg::after { content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 45%, transparent 40%, rgba(0,0,0,.55) 100%); }
  #fx { position: fixed; inset: 0; z-index: 4; pointer-events: none; }

  /* شاشة المغلف */
  .intro {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    transition: opacity .9s var(--ease) 1.5s, transform 1.2s var(--ease) 1.5s, filter .9s 1.5s;
  }
  .is-open .intro { opacity: 0; transform: scale(1.12); filter: blur(8px); pointer-events: none; }
  .kicker { font-size: 13px; letter-spacing: 6px; color: var(--gold); opacity: .85; }
  .intro-names {
    font-family: "Aref Ruqaa", serif; font-size: clamp(38px, 11vw, 52px); line-height: 1.2;
    background: linear-gradient(180deg, var(--gold-2), var(--gold) 55%, var(--gold-3));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .intro-names .amp { font-size: .6em; padding: 0 .2em; }

  .env-wrap { perspective: 1100px; }
  .env {
    position: relative; width: min(80vw, 330px); aspect-ratio: 3 / 2;
    transform-style: preserve-3d; cursor: pointer;
    transform: rotateX(calc(var(--ty, 0) * 1deg)) rotateY(calc(var(--tx, 0) * 1deg));
    will-change: transform;
  }
  .env-back, .env-front, .flap-face, .letter { position: absolute; border-radius: 10px; }
  .env-back { inset: 0; background: linear-gradient(160deg, #4a0e1a, #2a0710); box-shadow: 0 40px 70px rgba(0,0,0,.65); }
  .letter {
    left: 6%; right: 6%; top: 7%; height: 86%;
    background: linear-gradient(var(--paper), var(--paper-2));
    display: grid; place-items: center; color: var(--wine);
    font-family: "Aref Ruqaa", serif; font-size: 22px;
    transform: translateZ(1px); transition: transform 1.1s var(--ease) .75s;
  }
  .env-front {
    inset: 0; transform: translateZ(2px);
    background: linear-gradient(165deg, var(--wine-3), var(--wine) 70%);
    clip-path: polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%);
    box-shadow: inset 0 0 0 1px rgba(217,184,120,.35);
  }
  .env-front::after { /* خط ذهبي على الجيب */
    content: ""; position: absolute; inset: 10px; border-radius: 6px;
    border: 1px solid rgba(217,184,120,.35);
    clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%);
  }
  .flap { position: absolute; inset: 0 0 auto 0; height: 56%;
    transform-origin: 50% 0; transform-style: preserve-3d;
    transform: translateZ(3px); transition: transform .95s var(--ease-io) .15s; }
  .flap-face { inset: 0; border-radius: 10px 10px 0 0;
    background: linear-gradient(180deg, #9a2a3f, #6a1527);
    clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .seal {
    position: absolute; left: 50%; top: 56%; width: 70px; height: 70px; border-radius: 50%;
    transform: translate(-50%, -50%) translateZ(5px);
    background: radial-gradient(circle at 35% 30%, #fbe9bd, #c99c55 55%, #8f6a32);
    box-shadow: 0 6px 16px rgba(0,0,0,.55), inset 0 -3px 6px rgba(0,0,0,.25);
    display: grid; place-items: center;
    font-family: "Aref Ruqaa", serif; font-size: 22px; color: var(--wine);
    transition: transform .6s var(--ease), opacity .5s;
  }
  .seal::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; border: 1px dashed rgba(94,18,32,.45); }
  .seal::after { content: ""; position: absolute; inset: -6px; border-radius: 50%;
    border: 2px solid var(--gold); opacity: 0; animation: ping 2.2s var(--ease) infinite; }
  @keyframes ping { 0% { transform: scale(.85); opacity: .8; } 100% { transform: scale(1.6); opacity: 0; } }

  .is-opening .seal { transform: translate(-50%, -50%) translateZ(5px) scale(1.5); opacity: 0; }
  .is-opening .flap { transform: translateZ(.5px) rotateX(180deg); }
  .is-opening .letter { transform: translateZ(1px) translateY(-46%); }

  .hint { font-size: 14px; color: var(--gold); letter-spacing: 1px;
    animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }
  .is-opening .hint { opacity: 0; transition: opacity .3s; animation: none; }

  /* الكرت */
  .card {
    position: fixed; inset: 0; z-index: 3; overflow-y: auto; overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    background:
      radial-gradient(80% 40% at 50% 0%, rgba(217,184,120,.18), transparent 70%),
      linear-gradient(var(--paper), var(--paper-2));
    color: var(--ink);
    opacity: 0; visibility: hidden; transform: translateY(40px) scale(.97);
    transition: opacity 1s var(--ease), transform 1.2s var(--ease), visibility 0s 1.2s;
  }
  .is-revealed .card { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .sheet { max-width: 460px; margin: 0 auto; text-align: center;
    padding: calc(env(safe-area-inset-top) + 48px) 22px calc(env(safe-area-inset-bottom) + 110px); }
  .frame { position: fixed; inset: 10px; border: 1px solid rgba(168,132,74,.45); border-radius: 22px;
    pointer-events: none; z-index: 1; }
  .frame::after { content: ""; position: absolute; inset: 5px; border: 1px solid rgba(168,132,74,.25); border-radius: 18px; }

  section { padding: 26px 0; }
  .reveal { opacity: 0; transform: translateY(26px); filter: blur(4px);
    transition: opacity .9s var(--ease), transform 1s var(--ease), filter .9s var(--ease);
    transition-delay: var(--d, 0s); }
  .reveal.in { opacity: 1; transform: none; filter: none; }

  .basmala { font-family: "Aref Ruqaa", serif; font-size: 20px; color: var(--gold-3); }
  .monogram { position: relative; width: 160px; height: 160px; margin: 22px auto; border-radius: 50%;
    display: grid; place-items: center; }
  .monogram::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--gold-3), var(--gold-2), var(--gold), var(--gold-3), var(--gold-2), var(--gold-3));
    animation: rotate 14s linear infinite;
    -webkit-mask: radial-gradient(circle, transparent 62%, #000 63%); mask: radial-gradient(circle, transparent 62%, #000 63%); }
  @keyframes rotate { to { transform: rotate(360deg); } }
  .monogram .inner { width: 132px; height: 132px; border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 40% 35%, #a8344a, var(--wine));
    display: grid; place-items: center; color: var(--gold-2);
    font-family: "Aref Ruqaa", serif; font-size: 34px;
    box-shadow: inset 0 0 20px rgba(0,0,0,.35); }
  .monogram img { width: 100%; height: 100%; object-fit: cover; }

  .lead { color: var(--muted); font-size: 15px; line-height: 1.9; }
  .names { font-family: "Aref Ruqaa", serif; font-weight: 700; color: var(--wine);
    font-size: clamp(32px, 9.5vw, 44px); line-height: 1.45; margin: 10px 0; }
  .names .amp { display: block; font-size: .55em; color: var(--gold-3); }

  .divider { display: flex; align-items: center; gap: 12px; color: var(--gold-3); margin: 6px auto; max-width: 240px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-3), transparent); }

  .details { display: grid; gap: 10px; }
  .detail { display: flex; align-items: center; gap: 14px; text-align: right;
    background: rgba(255,255,255,.6); border: 1px solid rgba(168,132,74,.3); border-radius: 16px; padding: 14px 16px; }
  .detail .ic { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center;
    background: var(--wine); color: var(--gold-2); }
  .detail .ic svg { width: 20px; height: 20px; }
  .detail small { display: block; color: var(--muted); font-size: 12px; }
  .detail b { font-size: 16px; font-weight: 700; }

  h2 { font-family: "Aref Ruqaa", serif; font-size: 26px; color: var(--wine); margin-bottom: 14px; }
  .count { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; direction: rtl; }
  .count div { background: var(--wine); color: var(--gold-2); border-radius: 14px; padding: 12px 4px 10px;
    box-shadow: 0 10px 20px rgba(94,18,32,.18); }
  .count b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; transition: transform .35s var(--ease); }
  .count b.tick { transform: translateY(-3px) scale(1.08); }
  .count small { font-size: 12px; opacity: .8; }
  .done-msg { font-family: "Aref Ruqaa", serif; font-size: 24px; color: var(--wine); }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px;
    border-radius: 14px; font-weight: 700; font-size: 15px; text-decoration: none;
    transition: transform .2s var(--ease), box-shadow .2s, background .2s; }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: linear-gradient(var(--wine-2), var(--wine)); color: #fff; box-shadow: 0 10px 22px rgba(94,18,32,.28); }
  .btn-ghost { background: transparent; color: var(--wine); border: 1px solid rgba(94,18,32,.35); }
  .actions .btn:only-child { grid-column: 1 / -1; }

  .rsvp { display: grid; gap: 12px; text-align: right; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input { width: 100%; min-height: 50px; padding: 0 14px; border-radius: 14px;
    border: 1px solid rgba(168,132,74,.45); background: #fff; color: var(--ink); outline: none;
    transition: border-color .2s, box-shadow .2s; font-size: 16px; }
  .field input:focus { border-color: var(--wine-2); box-shadow: 0 0 0 4px rgba(140,31,51,.12); }
  .seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 14px;
    background: rgba(94,18,32,.08); }
  .seg button { position: relative; z-index: 1; min-height: 44px; border-radius: 10px; font-weight: 700; color: var(--muted); transition: color .3s; }
  .seg button[aria-pressed="true"] { color: #fff; }
  .seg .pill { position: absolute; top: 4px; bottom: 4px; right: 4px; width: calc(50% - 4px); border-radius: 10px;
    background: var(--wine); transition: transform .45s var(--ease); }
  .seg[data-v="no"] .pill { transform: translateX(-100%); }
  .stepper { display: flex; align-items: center; justify-content: space-between; min-height: 50px; padding: 0 6px;
    border-radius: 14px; border: 1px solid rgba(168,132,74,.45); background: #fff; transition: opacity .3s; }
  .stepper button { width: 40px; height: 40px; border-radius: 10px; background: rgba(94,18,32,.08); color: var(--wine); font-size: 20px; font-weight: 700; }
  .stepper output { font-size: 18px; font-weight: 700; color: var(--wine); }
  .rsvp.declined .guests { opacity: .35; pointer-events: none; }

  .closing { font-family: "Aref Ruqaa", serif; font-size: 22px; color: var(--wine); line-height: 1.8; }

  /* زر الموسيقى */
  .disc { position: fixed; z-index: 5; left: 18px; bottom: calc(env(safe-area-inset-bottom) + 18px);
    width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle, var(--wine) 0 22%, #111 23% 38%, #1b1b1b 39% 55%, #0c0c0c 56%);
    color: var(--gold-2); font-size: 18px; box-shadow: 0 10px 24px rgba(0,0,0,.4);
    opacity: 0; transform: scale(.6); pointer-events: none;
    transition: opacity .6s var(--ease), transform .6s var(--ease); }
  .is-revealed .disc.has-music { opacity: 1; transform: none; pointer-events: auto; }
  .disc.playing { animation: rotate 4s linear infinite; }

  .toast { position: fixed; z-index: 6; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px);
    transform: translate(-50%, 30px); opacity: 0; pointer-events: none;
    background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 12px; font-size: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,.3); transition: opacity .4s var(--ease), transform .4s var(--ease); white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .2s !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="fx"></canvas>

<!-- شاشة المغلف -->
<div class="intro">
  <p class="kicker">دعوة زفاف</p>
  <div class="env-wrap">
    <div class="env" id="env" role="button" tabindex="0" aria-label="افتح الدعوة">
      <div class="env-back"></div>
      <div class="letter" data-k="short"></div>
      <div class="env-front"></div>
      <div class="flap"><div class="flap-face"></div></div>
      <div class="seal" data-k="initials"></div>
    </div>
  </div>
  <h1 class="intro-names"><span data-k="groomShort"></span><span class="amp">&amp;</span><span data-k="brideShort"></span></h1>
  <p class="hint">المس الختم لفتح الدعوة</p>
</div>

<!-- الكرت -->
<main class="card" id="card">
  <div class="frame"></div>
  <div class="sheet">
    <section>
      <p class="basmala reveal">بسم الله الرحمن الرحيم</p>
      <div class="monogram reveal" style="--d:.1s"><div class="inner" id="mono"></div></div>
      <p class="lead reveal" style="--d:.2s">بقلوبٍ يملؤها الفرح والسرور<br>نتشرف بدعوتكم لحضور حفل زفاف</p>
      <h2 class="names reveal" style="--d:.3s"><span data-k="groom"></span><span class="amp">&amp;</span><span data-k="bride"></span></h2>
      <div class="divider reveal" style="--d:.4s">✦</div>
    </section>

    <section class="details">
      <div class="detail reveal">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
        <div><small id="dayText"></small><b id="dateText"></b><small id="hijriText"></small></div>
      </div>
      <div class="detail reveal" style="--d:.1s">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
        <div><small>الوقت</small><b id="timeText"></b></div>
      </div>
      <div class="detail reveal" style="--d:.2s">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></span>
        <div><small>المكان</small><b data-k="venue"></b></div>
      </div>
      <div class="actions reveal" style="--d:.3s">
        <a class="btn btn-primary" id="mapBtn" target="_blank" rel="noopener">الموقع على الخريطة</a>
        <button class="btn btn-ghost" id="calBtn" type="button">أضف للتقويم</button>
      </div>
    </section>

    <section>
      <h2 class="reveal">نقترب من أجمل موعد</h2>
      <div class="count reveal" style="--d:.1s" id="count">
        <div><b id="cd">0</b><small>يوم</small></div>
        <div><b id="ch">0</b><small>ساعة</small></div>
        <div><b id="cm">0</b><small>دقيقة</small></div>
        <div><b id="cs">0</b><small>ثانية</small></div>
      </div>
    </section>

    <section>
      <h2 class="reveal">تأكيد الحضور</h2>
      <form class="rsvp reveal" style="--d:.1s" id="rsvp" novalidate>
        <div class="field">
          <label for="gname">الاسم الكريم</label>
          <input id="gname" autocomplete="name" placeholder="اكتب اسمك" required>
        </div>
        <div class="seg" id="seg" data-v="yes">
          <span class="pill"></span>
          <button type="button" data-v="yes" aria-pressed="true">سأحضر بإذن الله</button>
          <button type="button" data-v="no" aria-pressed="false">أعتذر</button>
        </div>
        <div class="field guests">
          <label>عدد الحضور</label>
          <div class="stepper">
            <button type="button" id="minus" aria-label="إنقاص">−</button>
            <output id="guests">1</output>
            <button type="button" id="plus" aria-label="زيادة">+</button>
          </div>
        </div>
        <button class="btn btn-primary" type="submit">إرسال الرد</button>
      </form>
    </section>

    <section>
      <p class="closing reveal">حضوركم يكمل فرحتنا<br>وبانتظاركم بكل حب</p>
      <div class="divider reveal" style="--d:.1s">✦</div>
    </section>
  </div>
</main>

<button class="disc" id="disc" aria-label="تشغيل الموسيقى">♪</button>
<audio id="audio" loop preload="none"></audio>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= الإعدادات: عدّل هنا فقط ================= */
const CONFIG = {
  groom: 'باسل محمد البقمي',
  bride: 'سحر المالكي',
  groomShort: 'باسل',
  brideShort: 'سحر',
  date: '2027-01-09T21:30:00+03:00', // موعد الحفل (السنة-الشهر-اليوم T الساعة:الدقيقة)
  venue: 'اسم القاعة، المدينة',
  mapUrl: '',     // رابط الموقع من خرائط قوقل
  whatsapp: '',   // رقمك لاستقبال الردود، مثل 9665XXXXXXXX
  music: '',      // اسم ملف الموسيقى بعد رفعه، مثل music.mp3
  photo: 'Photo.JPG'   // صورة العروسين
};
/* ============================================================ */

const $ = s => document.querySelector(s);
const root = document.documentElement;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const eventDate = new Date(CONFIG.date);

// تعبئة النصوص
const fill = {
  ...CONFIG,
  short: `${CONFIG.groomShort} & ${CONFIG.brideShort}`,
  initials: `${CONFIG.groomShort[0]} ${CONFIG.brideShort[0]}`
};
document.querySelectorAll('[data-k]').forEach(el => el.textContent = fill[el.dataset.k]);
$('#mono').innerHTML = CONFIG.photo
  ? `<img src="${CONFIG.photo}" alt="${CONFIG.groomShort} و ${CONFIG.brideShort}">`
  : `${CONFIG.groomShort[0]} ♥ ${CONFIG.brideShort[0]}`;

const tz = { timeZone: 'Asia/Riyadh' };
$('#dayText').textContent = eventDate.toLocaleDateString('ar-SA', { ...tz, weekday: 'long' });
$('#dateText').textContent = eventDate.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn', { ...tz, day: 'numeric', month: 'long', year: 'numeric' });
$('#hijriText').textContent = eventDate.toLocaleDateString('ar-SA-u-ca-islamic-umalqura-nu-latn', { ...tz, day: 'numeric', month: 'long', year: 'numeric' });
$('#timeText').textContent = eventDate.toLocaleTimeString('ar-SA-u-nu-latn', { ...tz, hour: 'numeric', minute: '2-digit' });

if (CONFIG.mapUrl) $('#mapBtn').href = CONFIG.mapUrl; else $('#mapBtn').remove();

/* ---------- الجزيئات الذهبية ---------- */
const cv = $('#fx'), ctx = cv.getContext('2d');
let W, H, parts = [];
function size() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
size(); addEventListener('resize', size);

function ambient(initial) {
  return { x: Math.random() * W, y: initial ? Math.random() * H : H + 10,
    vx: (Math.random() - .5) * .15, vy: -(.15 + Math.random() * .35), g: 0,
    r: .6 + Math.random() * 1.6, a: .25 + Math.random() * .45, life: Infinity, amb: true, rot: 0, vr: 0 };
}
function burst(x, y) {
  if (reduce) return;
  for (let i = 0; i < 70; i++) {
    const ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 6, petal = Math.random() < .35;
    parts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 2, g: .09,
      r: petal ? 4 + Math.random() * 3 : 1 + Math.random() * 2, a: 1, life: 90 + Math.random() * 50,
      petal, rot: Math.random() * 6, vr: (Math.random() - .5) * .2 });
  }
}
if (!reduce) for (let i = 0; i < 40; i++) parts.push(ambient(true));

(function loop() {
  ctx.clearRect(0, 0, W, H);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.rot += p.vr;
    if (!p.amb) { p.vx *= .985; p.life--; p.a = Math.min(1, p.life / 40); }
    else if (p.y < -10) Object.assign(p, ambient(false));
    ctx.globalAlpha = p.a;
    if (p.petal) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = '#8c1f33'; ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .55, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = '#e8c98c'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(loop);
})();

/* ---------- ميلان ثلاثي الأبعاد ناعم ---------- */
const env = $('#env');
let tx = 0, ty = 0, cx = 0, cy = 0, pointer = false;
function aim(x, y) { pointer = true; tx = (x / W - .5) * 26; ty = -(y / H - .5) * 22; }
addEventListener('pointermove', e => aim(e.clientX, e.clientY));
addEventListener('touchmove', e => aim(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
(function tilt(t) {
  if (!root.classList.contains('is-revealed')) {
    const ix = pointer ? tx : Math.sin(t / 1400) * 8;
    const iy = pointer ? ty : Math.cos(t / 1700) * 5 + 6;
    cx += (ix - cx) * .07; cy += (iy - cy) * .07;
    env.style.setProperty('--tx', cx.toFixed(2));
    env.style.setProperty('--ty', cy.toFixed(2));
    requestAnimationFrame(tilt);
  }
})(0);

/* ---------- فتح الدعوة ---------- */
function openInvite() {
  if (root.classList.contains('is-opening')) return;
  root.classList.add('is-opening');
  const r = env.getBoundingClientRect();
  setTimeout(() => burst(r.left + r.width / 2, r.top + r.height * .45), 250);
  startMusic();
  setTimeout(() => root.classList.add('is-open'), 900);
  setTimeout(() => { root.classList.add('is-revealed'); observeReveals(); }, 2100);
}
env.addEventListener('click', openInvite);
env.addEventListener('keydown', e => (e.key === 'Enter' || e.key === ' ') && openInvite());

function observeReveals() {
  const io = new IntersectionObserver(entries => entries.forEach(en => {
    if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
  }), { root: $('#card'), threshold: .15 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
}

/* ---------- الموسيقى ---------- */
const audio = $('#audio'), disc = $('#disc');
if (CONFIG.music) { audio.src = CONFIG.music; disc.classList.add('has-music'); }
function startMusic() {
  if (!CONFIG.music) return;
  audio.play().then(() => disc.classList.add('playing')).catch(() => {});
}
disc.addEventListener('click', () => {
  if (audio.paused) startMusic(); else { audio.pause(); disc.classList.remove('playing'); }
});

/* ---------- العداد التنازلي ---------- */
const cells = { d: $('#cd'), h: $('#ch'), m: $('#cm'), s: $('#cs') };
function setCell(el, v) {
  if (el.textContent === String(v)) return;
  el.textContent = v; el.classList.add('tick');
  setTimeout(() => el.classList.remove('tick'), 300);
}
function countdown() {
  const diff = eventDate - Date.now();
  if (diff <= 0) {
    $('#count').outerHTML = '<p class="done-msg">حان موعد الفرح، بارك الله لهما</p>';
    return clearInterval(timer);
  }
  setCell(cells.d, Math.floor(diff / 864e5));
  setCell(cells.h, Math.floor(diff % 864e5 / 36e5));
  setCell(cells.m, Math.floor(diff % 36e5 / 6e4));
  setCell(cells.s, Math.floor(diff % 6e4 / 1e3));
}
const timer = setInterval(countdown, 1000); countdown();

/* ---------- إضافة للتقويم ---------- */
$('#calBtn').addEventListener('click', () => {
  const f = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const end = new Date(eventDate.getTime() + 4 * 36e5);
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//invite//ar', 'BEGIN:VEVENT',
    `UID:${Date.now()}@invite`, `DTSTAMP:${f(new Date())}`, `DTSTART:${f(eventDate)}`, `DTEND:${f(end)}`,
    `SUMMARY:زفاف ${CONFIG.groomShort} و${CONFIG.brideShort}`, `LOCATION:${CONFIG.venue}`,
    'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
  a.download = 'wedding.ics'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* ---------- تأكيد الحضور ---------- */
let attending = 'yes', guests = 1;
const seg = $('#seg'), form = $('#rsvp');
seg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  attending = b.dataset.v; seg.dataset.v = attending;
  seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  form.classList.toggle('declined', attending === 'no');
});
$('#plus').addEventListener('click', () => $('#guests').textContent = guests = Math.min(10, guests + 1));
$('#minus').addEventListener('click', () => $('#guests').textContent = guests = Math.max(1, guests - 1));

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600);
}
form.addEventListener('submit', e => {
  e.preventDefault();
  const name = $('#gname').value.trim();
  if (!name) { $('#gname').focus(); return toast('فضلاً اكتب اسمك'); }
  const msg = attending === 'yes'
    ? `السلام عليكم، أؤكد حضوري لحفل زفاف ${CONFIG.groomShort} و${CONFIG.brideShort}\nالاسم: ${name}\nعدد الحضور: ${guests}`
    : `السلام عليكم، أعتذر عن حضور حفل زفاف ${CONFIG.groomShort} و${CONFIG.brideShort}، مع خالص التهاني\nالاسم: ${name}`;
  toast('شكراً لك، جارٍ فتح واتساب');
  burst(innerWidth / 2, innerHeight * .6);
  setTimeout(() => location.href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, 700);
});
</script>
</body>
